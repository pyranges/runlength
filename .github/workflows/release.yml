# Releases.
#
#   py-vX.Y.Z    builds and tests wheels on every platform, then publishes
#                them and the sdist to PyPI (trusted publishing, no token).
#   rust-vX.Y.Z  publishes runlength, then runlength-arrow, to crates.io
#                (needs the CARGO_REGISTRY_TOKEN secret).
#
# The tag's version must match the version in the crates' Cargo.toml.
# Deployment environments (for required reviewers before publishing) need a
# paid plan for private repositories; add them once the repo is public.
#
# Running the workflow by hand ("Run workflow" in the Actions tab) builds and
# tests the wheels without publishing anything.
name: Release

on:
  push:
    tags: ["py-v*", "rust-v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-version:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches Cargo.toml
        run: |
          tag="${GITHUB_REF_NAME#py-v}"
          tag="${tag#rust-v}"
          for crate in runlength runlength-arrow runlength-py; do
            version=$(grep -m1 '^version' "crates/$crate/Cargo.toml" | cut -d'"' -f2)
            if [ "$version" != "$tag" ]; then
              echo "::error::tag $GITHUB_REF_NAME does not match $crate version $version"
              exit 1
            fi
          done

  wheels:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref_name, 'py-v')
    name: wheel ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64, os: ubuntu-latest, target: x86_64, manylinux: "2_28", test: true }
          - { name: linux-aarch64, os: ubuntu-latest, target: aarch64, manylinux: "2_28", test: false }
          # musllinux wheels (Alpine) are built but not tested: the host runs glibc.
          - { name: musllinux-x86_64, os: ubuntu-latest, target: x86_64, manylinux: musllinux_1_2, test: false }
          - { name: musllinux-aarch64, os: ubuntu-latest, target: aarch64, manylinux: musllinux_1_2, test: false }
          - { name: macos-universal2, os: macos-latest, target: universal2-apple-darwin, test: true }
          - { name: windows-x64, os: windows-latest, target: x64, test: true }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux || 'auto' }}
          working-directory: crates/runlength-py
          args: --release --out dist
      # Tests run against the installed wheel, not the source tree, so a
      # broken wheel fails here instead of on PyPI.
      - name: Test the wheel
        if: matrix.test
        shell: bash
        run: |
          python -m venv .wheel-venv
          if [ -d .wheel-venv/Scripts ]; then py=.wheel-venv/Scripts/python; else py=.wheel-venv/bin/python; fi
          $py -m pip install --upgrade pip
          $py -m pip install pytest polars pandas pyarrow numpy arro3-core
          $py -m pip install --no-index --find-links crates/runlength-py/dist runlength
          cd crates/runlength-py/tests && ../../../$py -m pytest -q
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.name }}
          path: crates/runlength-py/dist/*.whl

  sdist:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref_name, 'py-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          working-directory: crates/runlength-py
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: crates/runlength-py/dist/*.tar.gz

  publish-pypi:
    if: startsWith(github.ref_name, 'py-v')
    needs: [check-version, wheels, sdist]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist

  publish-crates:
    if: startsWith(github.ref_name, 'rust-v')
    needs: [check-version]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test -p runlength -p runlength-arrow
      # cargo waits for each crate to appear in the index before returning,
      # so runlength-arrow can resolve the runlength it depends on.
      - run: cargo publish -p runlength
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - run: cargo publish -p runlength-arrow
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
