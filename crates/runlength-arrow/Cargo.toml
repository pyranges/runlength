[package]
name = "runlength-arrow"
version = "0.1.0"
description = "Run-length encoded sequences over Apache Arrow arrays of any type."
keywords = ["run-length", "rle", "arrow"]
categories = ["data-structures"]
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"
rust-version.workspace = true

[dependencies]
runlength = { path = "../runlength", version = "0.1.0" }
rayon = "1.10"
# Kept on the same Arrow release as pyo3-arrow, which the Python bindings use.
arrow-arith = "59"
arrow-array = "59"
arrow-buffer = "59"
arrow-cast = "59"
arrow-ord = "59"
arrow-row = "59"
arrow-schema = "59"
arrow-select = "59"

[dev-dependencies]
proptest = "1.5"
