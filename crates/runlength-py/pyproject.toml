[build-system]
requires = ["maturin>=1.5,<2"]
build-backend = "maturin"

[project]
name = "runlength"
description = "Run-length encoded sequences of any type, backed by Rust and Apache Arrow."
readme = "../../README.md"
requires-python = ">=3.11"
license = "MIT"
dynamic = ["version"]
# arro3-core provides the classes of returned arrays and tables (small, Arrow only).
dependencies = ["arro3-core>=0.9"]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]

[project.optional-dependencies]
polars = ["polars>=1.0"]
pandas = ["pandas>=2.0", "pyarrow>=14"]
pyarrow = ["pyarrow>=14"]
numpy = ["numpy>=1.24"]
test = ["pytest", "polars>=1.0", "pandas>=2.0", "pyarrow>=14", "numpy>=1.24"]

[tool.maturin]
python-source = "python"
module-name = "runlength._runlength"
features = ["pyo3/extension-module"]
